<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MG-ADL Tracker</title>

<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --primary:#2563eb;
  --danger:#dc2626;
  --success:#16a34a;
  --text:#1f2937;
  --border:#d1d5db;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
}

h1,h2{
  margin-bottom:15px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

select,
input,
textarea{
  width:100%;
  padding:8px;
  border:1px solid var(--border);
  border-radius:6px;
}

textarea{
  min-height:100px;
}

button{
  border:none;
  padding:10px 16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-success{
  background:var(--success);
  color:white;
}

.med-row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.med-row input{
  flex:1;
}

.summary{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.history-entry{
  border:1px solid var(--border);
  border-radius:8px;
  padding:15px;
  margin-bottom:15px;
  background:#fafafa;
}

.score-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:8px;
  margin-top:10px;
  margin-bottom:10px;
}

.score-item{
  background:white;
  border:1px solid var(--border);
  padding:8px;
  border-radius:6px;
}

.small{
  font-size:12px;
  color:#555;
}

@media(max-width:600px){
  .med-row{
    flex-direction:column;
  }
}
</style>
</head>
<body>

<div class="container">

<h1>MG-ADL Tracker</h1>

<div class="card">
  <h2>MG-ADL Entry</h2>

  <div class="grid">

    <div>
      <label>Talking</label>
      <select id="talking">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Intermittent slurring</option>
        <option value="2">2 - Constant slurring</option>
        <option value="3">3 - Difficult to understand</option>
      </select>
    </div>

    <div>
      <label>Chewing</label>
      <select id="chewing">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Fatigue with solid food</option>
        <option value="2">2 - Soft food preferred</option>
        <option value="3">3 - Feeding assistance required</option>
      </select>
    </div>

    <div>
      <label>Swallowing</label>
      <select id="swallowing">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Rare choking</option>
        <option value="2">2 - Frequent choking</option>
        <option value="3">3 - Tube feeding required</option>
      </select>
    </div>

    <div>
      <label>Breathing</label>
      <select id="breathing">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Shortness with exertion</option>
        <option value="2">2 - Shortness at rest</option>
        <option value="3">3 - Ventilatory support</option>
      </select>
    </div>

    <div>
      <label>Brushing Teeth / Hair</label>
      <select id="brushing">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Extra effort</option>
        <option value="2">2 - Rest periods needed</option>
        <option value="3">3 - Assistance required</option>
      </select>
    </div>

    <div>
      <label>Rising From Chair</label>
      <select id="chair">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Mild difficulty</option>
        <option value="2">2 - Moderate difficulty</option>
        <option value="3">3 - Requires assistance</option>
      </select>
    </div>

    <div>
      <label>Double Vision</label>
      <select id="doubleVision">
        <option value="0">0 - None</option>
        <option value="1">1 - Occasional</option>
        <option value="2">2 - Frequent</option>
        <option value="3">3 - Constant</option>
      </select>
    </div>

    <div>
      <label>Eyelid Droop</label>
      <select id="eyelid">
        <option value="0">0 - None</option>
        <option value="1">1 - Occasional</option>
        <option value="2">2 - Frequent</option>
        <option value="3">3 - Constant</option>
      </select>
    </div>

  </div>

  <div class="summary">
    <div>Total Score: <span id="totalScore">0</span></div>
    <div>Severity: <span id="severity">Minimal</span></div>
  </div>
</div>

<div class="card">
  <h2>Medications</h2>

  <div id="medications"></div>

  <button class="btn-primary" onclick="addMedication()">Add Medication</button>
</div>

<div class="card">
  <h2>Notes</h2>
  <textarea id="notes" placeholder="Enter notes..."></textarea>
</div>

<div class="card">
  <button class="btn-success" onclick="saveEntry()">Save Entry</button>
</div>

<div class="card">
  <h2>History</h2>
  <div id="history"></div>
</div>

</div>

<script>
const categories = [
  "talking",
  "chewing",
  "swallowing",
  "breathing",
  "brushing",
  "chair",
  "doubleVision",
  "eyelid"
];

function addMedication(name="", dose=""){
  const holder = document.getElementById("medications");

  const row = document.createElement("div");
  row.className = "med-row";

  row.innerHTML = `
    <input type="text" class="med-name" placeholder="Medication" value="${name}">
    <input type="text" class="med-dose" placeholder="Dose" value="${dose}">
    <button class="btn-danger" onclick="this.parentElement.remove(); saveMedications();">Delete</button>
  `;

  holder.appendChild(row);
  saveMedications();
}

function getTotalScore(){
  let total = 0;

  categories.forEach(id=>{
    total += Number(document.getElementById(id).value);
  });

  return total;
}

function getSeverity(score){
  if(score <= 4) return "Minimal";
  if(score <= 8) return "Mild";
  if(score <= 12) return "Moderate";
  if(score <= 18) return "Significant";
  return "Severe";
}

function updateScore(){
  const score = getTotalScore();

  document.getElementById("totalScore").textContent = score;
  document.getElementById("severity").textContent = getSeverity(score);
}

categories.forEach(id=>{
  window.addEventListener("load",()=>{
    document.getElementById(id).addEventListener("change",updateScore);
  });
});

function saveMedications(){
  const meds = [];

  document.querySelectorAll(".med-row").forEach(row=>{
    meds.push({
      name: row.querySelector(".med-name").value,
      dose: row.querySelector(".med-dose").value
    });
  });

  localStorage.setItem("mgadl_meds", JSON.stringify(meds));
}

document.addEventListener("input",e=>{
  if(
    e.target.classList.contains("med-name") ||
    e.target.classList.contains("med-dose")
  ){
    saveMedications();
  }
});

function loadMedications(){
  const meds =
    JSON.parse(localStorage.getItem("mgadl_meds")) || [];

  if(meds.length===0){
    addMedication();
    return;
  }

  meds.forEach(m=>{
    addMedication(m.name,m.dose);
  });
}

function saveEntry(){

  saveMedications();

  const entry = {
    date:new Date().toLocaleString(),
    talking:Number(document.getElementById("talking").value),
    chewing:Number(document.getElementById("chewing").value),
    swallowing:Number(document.getElementById("swallowing").value),
    breathing:Number(document.getElementById("breathing").value),
    brushing:Number(document.getElementById("brushing").value),
    chair:Number(document.getElementById("chair").value),
    doubleVision:Number(document.getElementById("doubleVision").value),
    eyelid:Number(document.getElementById("eyelid").value),
    total:getTotalScore(),
    severity:getSeverity(getTotalScore()),
    notes:document.getElementById("notes").value,
    medications:JSON.parse(
      localStorage.getItem("mgadl_meds") || "[]"
    )
  };

  const history =
    JSON.parse(localStorage.getItem("mgadl_history")) || [];

  history.unshift(entry);

  localStorage.setItem(
    "mgadl_history",
    JSON.stringify(history)
  );

  renderHistory();
  alert("Entry saved.");
}

function deleteHistory(index){

  const history =
    JSON.parse(localStorage.getItem("mgadl_history")) || [];

  history.splice(index,1);

  localStorage.setItem(
    "mgadl_history",
    JSON.stringify(history)
  );

  renderHistory();
}

function renderHistory(){

  const history =
    JSON.parse(localStorage.getItem("mgadl_history")) || [];

  const container =
    document.getElementById("history");

  if(history.length===0){
    container.innerHTML =
      "<p>No entries saved.</p>";
    return;
  }

  container.innerHTML = "";

  history.forEach((entry,index)=>{

    const div = document.createElement("div");
    div.className = "history-entry";

    let meds = "None";

    if(entry.medications.length){
      meds = entry.medications
        .map(m => `${m.name} ${m.dose}`)
        .join(", ");
    }

    div.innerHTML = `
      <strong>${entry.date}</strong>

      <div class="score-grid">
        <div class="score-item">Talking: ${entry.talking}</div>
        <div class="score-item">Chewing: ${entry.chewing}</div>
        <div class="score-item">Swallowing: ${entry.swallowing}</div>
        <div class="score-item">Breathing: ${entry.breathing}</div>
        <div class="score-item">Brushing: ${entry.brushing}</div>
        <div class="score-item">Chair: ${entry.chair}</div>
        <div class="score-item">Double Vision: ${entry.doubleVision}</div>
        <div class="score-item">Eyelid Droop: ${entry.eyelid}</div>
      </div>

      <p><strong>Total:</strong> ${entry.total}</p>
      <p><strong>Severity:</strong> ${entry.severity}</p>
      <p><strong>Medications:</strong> ${meds}</p>
      <p><strong>Notes:</strong> ${entry.notes || "-"}</p>

      <button class="btn-danger"
        onclick="deleteHistory(${index})">
        Delete Entry
      </button>
    `;

    container.appendChild(div);
  });
}

window.onload = () => {
  loadMedications();
  updateScore();
  renderHistory();
};
</script>

</body>
</html>
