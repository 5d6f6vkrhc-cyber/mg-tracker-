<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MG Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef4ff;
    margin:0;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}
.score{
    font-size:36px;
    font-weight:bold;
    color:#2563eb;
}
</style>

<script>
function updateScore(){
    let total = 0;

    ["talk","chew","swallow","breathing","vision","ptosis"]
    .forEach(group => {
        const selected =
        document.querySelector(
        'input[name="'+group+'"]:checked');

        if(selected){
            total += parseInt(selected.value);
        }
    });

    document.getElementById("score").innerHTML =
        total + "/24";

    let severity="Mild";

    if(total>=16){severity="Severe";}
    else if(total>=8){severity="Moderate";}

    document.getElementById("severity").innerHTML =
        severity;
}

window.onload=function(){
    updateScore();
}
</script>
</head>

<body>

<div class="card">
<div class="score" id="score">0/24</div>
<div id="severity">Mild</div>
</div>

<div class="card">
<h2>Talking</h2>
<label><input type="radio" name="talk" value="0" checked onchange="updateScore()">0 Normal</label>
<label><input type="radio" name="talk" value="1" onchange="updateScore()">1 Mild</label>
<label><input type="radio" name="talk" value="2" onchange="updateScore()">2 Moderate</label>
<label><input type="radio" name="talk" value="3" onchange="updateScore()">3 Severe</label>
</div>

<div class="card">
<h2>Chewing</h2>
<label><input type="radio" name="chew" value="0" checked onchange="updateScore()">0 Normal</label>
<label><input type="radio" name="chew" value="1" onchange="updateScore()">1 Mild</label>
<label><input type="radio" name="chew" value="2" onchange="updateScore()">2 Moderate</label>
<label><input type="radio" name="chew" value="3" onchange="updateScore()">3 Severe</label>
</div>

</body>
</html>
